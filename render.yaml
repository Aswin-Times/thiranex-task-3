databases:
  - name: atelier-postgres
    plan: free
    databaseName: atelier
    user: atelier

services:
  - type: web
    name: atelier-commerce
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@atelier.demo
      - key: ADMIN_PASSWORD
        value: ChangeMe-Atelier-2026

